# Homepage Editor: edits Homepage's config in place (same folder Homepage mounts).
#   docker compose up -d --build
# Edit the volume paths below to point at your own Homepage config folder before running.
services:
  homepage-editor:
    build: .
    container_name: homepage-editor
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      # If Homepage isn't on the same Docker network, use its LAN address instead, e.g. http://192.168.1.10:3000
      HOMEPAGE_URL: http://homepage:3000
      HOMEPAGE_CONTAINER: homepage
      DOCKER_PROXY: http://docker-restart-proxy:2375
      # Optional password (any user name): put EDITOR_PASSWORD=... in a .env file next to this one.
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
    volumes:
      - /path/to/your/homepage/config:/config
      - /path/to/your/homepage/editor-backups:/backups
    depends_on:
      - docker-restart-proxy

  # Lets the editor restart Homepage (needed after adding icons/backgrounds) and nothing else:
  # only container stop/restart/kill is allowed; creating containers, exec, images etc. are denied.
  docker-restart-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-editor-docker-proxy
    restart: unless-stopped
    environment:
      POST: 1
      ALLOW_RESTARTS: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
